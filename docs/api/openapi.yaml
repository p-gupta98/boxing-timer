openapi: '3.0.3'
info:
  title: Boxing Timer API
  version: '1.0.0'
  description: |
    The Boxing Timer API allows you to create and save timer presets in your account, and save sessions when you use presets.

    ### Check out its awesome features:

    * Set the fight, rest durations
    * Set the number of rounds
    * Create presets for different timers
    * Save your boxing sessions in your profile

servers:
  - url: http://localhost:3000
    description: Local development

security:
  - bearerAuth: []    

paths:
  /presets:
    get:
      summary: List all presets
      responses:
        "200":
          description: A list of presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Preset"
        "401":
          $ref: "#/components/responses/Unauthorized"          

    post:
      summary: Create a preset
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPreset"
      responses:
        "201":
          description: The preset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
        "401":
          $ref: "#/components/responses/Unauthorized"  
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /presets/{id}:
    put:
      summary: Replace a preset
      parameters: 
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPreset"
      responses:
        "200":
          description: The updated preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"        
        "404":
          description: Preset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a preset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted (no body)
        "401":
          $ref: "#/components/responses/Unauthorized"    
        "404":
          description: Preset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /login:
    post:
      summary: Log in a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Login successful, returns a token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /users:
    post:
      summary: Create a user
      security: []
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: The User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"        

  /users/me:
    get:
      summary: View my account information
      responses:
        "200":
          description: The logged-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"              

  /sessions:
    get:
      summary: List all sessions
      responses:
        "200":
          description: A list of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a session
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSession"
      responses:
        "201":
          description: The session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"  
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sessions/{id}:
    get:
      summary: View a particular session
      parameters: 
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"        
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Preset:
      type: object
      required: [id, name, fight_duration, rest_duration, total_rounds]
      properties:
        id: { type: string }
        name: { type: string }
        fight_duration: { type: integer, minimum: 1, description: Duration in seconds }
        rest_duration: { type: integer, minimum: 1, description: Duration in seconds }
        total_rounds: { type: integer, minimum: 1 }

    NewPreset:
      type: object
      required: [name, fight_duration, rest_duration, total_rounds]
      properties: 
        name: { type: string }
        fight_duration: { type: integer, minimum: 1, description: Duration in seconds }
        rest_duration: { type: integer, minimum: 1, description: Duration in seconds }
        total_rounds: { type: integer, minimum: 1 }

    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }

    NewUser:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    Session:
      type: object
      required: [id, name, date, fight_duration, rest_duration, total_rounds, rounds_completed, session_completed]
      properties:
        id: { type: string }
        name: { type: string }
        date: { type: string, format: date-time }
        fight_duration: { type: integer, minimum: 1, description: Duration in seconds }
        rest_duration: { type: integer, minimum: 1, description: Duration in seconds }
        total_rounds: { type: integer, minimum: 1 }
        rounds_completed: { type: integer, minimum: 0 }
        session_completed: { type: boolean }
        preset_id: { type: string }

    NewSession:
      type: object
      required: [name, date, fight_duration, rest_duration, total_rounds, rounds_completed, session_completed]
      properties:
        name: { type: string }
        date: { type: string, format: date-time }
        fight_duration: { type: integer, minimum: 1, description: Duration in seconds }
        rest_duration: { type: integer, minimum: 1, description: Duration in seconds }
        total_rounds: { type: integer, minimum: 1 }
        rounds_completed: { type: integer, minimum: 0 }
        session_completed: { type: boolean }
        preset_id: { type: string }    

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string, example: "Preset not found" }

    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }    


        